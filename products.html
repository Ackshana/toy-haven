<!DOCTYPE html>
<html lang="en">

<head>
    <title>Products | Toy Haven</title>
    <meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Toy Haven - toys, figurines, board games and diecast cars.">
<link rel="icon" href="assets/favicon.svg">
<link rel="stylesheet" href="css/style.css">
<link rel="manifest" href="manifest.json">
</head>

<body>

<!-- HEADER / NAVIGATION -->
<header class="header">
    <div class="container header-inner">

        <a class="logo" href="index.html">TOY HAVEN</a>

        <!-- Mobile menu button -->
        <button class="menu-button" aria-label="Open menu" aria-expanded="false" aria-controls="main-nav">
            <span></span>
            <span></span>
            <span></span>
        </button>

        <nav id="main-nav" class="nav" aria-label="Main navigation">
            <a href="index.html">Home</a>
            <a href="products.html">Products</a>
            <a href="wishlist.html">Wishlist</a>
            <a href="cart.html">
                Cart <span class="cart-number">0</span>
            </a>
            <a href="support.html">Support</a>
        </nav>

    </div>
</header>

<main>

<!-- PRODUCTS PAGE -->

<section class="page-head container">

    <p class="kicker">TOY HAVEN COLLECTION</p>

    <h1>Shop the products.</h1>

    <p>
        Search for a product or choose a category.
    </p>

</section>


<!-- SEARCH AND FILTERS -->
<section class="tools container">

    <input
        id="searchInput"
        class="search-box"
        type="search"
        placeholder="Search product name..."
        aria-label="Search products by name"
    >

    <div class="filter-buttons">

        <button class="filter active" data-category="All">
            All
        </button>

        <button class="filter" data-category="Figurines">
            Figurines
        </button>

        <button class="filter" data-category="Toys">
            Toys
        </button>

        <button class="filter" data-category="Board Games">
            Board Games
        </button>

        <button class="filter" data-category="Diecast Cars">
            Diecast Cars
        </button>

    </div>

</section>


<!-- PRODUCT GRID -->
<section class="section container">

    <div id="productGrid" class="product-grid"></div>

</section>


<!-- PRODUCT DETAILS MODAL -->
<div id="productModal" class="modal hidden">

    <div class="modal-content">

        <button id="closeModal" class="close-modal" aria-label="Close product details">
            X
        </button>

        <img id="modalImage" src="" alt="Product">

        <div>

            <p id="modalCategory" class="product-category"></p>

            <h2 id="modalName"></h2>

            <p id="modalDescription"></p>

            <p id="modalPrice" class="price"></p>

            <div class="modal-actions">
                <button
                    class="btn btn-black"
                    onclick="addToCart(document.querySelector('#modalName').dataset.id)"
                >
                    Add to Cart
                </button>

                <button id="modalWishlist" class="btn btn-white" type="button">
                    Add to Wishlist
                </button>
            </div>

        </div>

    </div>

</div>

</main>

<!-- FOOTER -->
<footer class="footer">

    <div class="container footer-grid">

        <div>
            <h3>TOY HAVEN</h3>
            <p>A simple online collection for toy fans and collectors.</p>
        </div>

        <div>
            <h3>Quick Links</h3>
            <a href="products.html">Products</a>
            <a href="wishlist.html">Wishlist</a>
            <a href="cart.html">Cart</a>
            <a href="support.html">Support</a>
        </div>

        <div>
            <h3>Newsletter</h3>

            <form id="newsletterForm" class="newsletter">

                <input
                    id="newsletterEmail"
                    type="email"
                    placeholder="Your email"
                    aria-label="Newsletter email address"
                    required
                >

                <button class="btn btn-white" type="submit">
                    Join
                </button>

            </form>

            <p id="newsletterMessage"></p>
        </div>

    </div>

    <div class="container footer-bottom">
        <p>© 2026 Toy Haven</p>
    </div>

</footer>

<script src="js/products.js"></script>
<script src="js/script.js"></script>

</body>
</html>
