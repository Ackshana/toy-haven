<!DOCTYPE html>

<head>

    <meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Toy Haven - toys, figurines, board games and diecast cars.">
<link rel="icon" href="assets/favicon.svg">
<link rel="stylesheet" href="css/style.css">

</head>

<body>

<!-- HEADER / NAVIGATION -->
<header class="header">

        <a class="logo" href="index.html">TOY HAVEN</a>

        <!-- Mobile menu button -->
        <button class="menu-button" aria-label="Open menu" aria-expanded="false" aria-controls="main-nav">
            <span></span>
            <span></span>
            <span></span>
        </button>

        <nav id="main-nav" class="nav" aria-label="Main navigation">
            <a href="index.html">Home</a>
            <a href="products.html">Products</a>
            <a href="wishlist.html">Wishlist</a>
            <a href="cart.html">
                Cart <span class="cart-number">0</span>
            </a>
            <a href="support.html">Support</a>
        </nav>

    </div>
</header>

<main>

<!-- WISHLIST PAGE -->

<section class="page-head container">

    <p class="kicker">MY COLLECTION</p>

    <h1>Wishlist.</h1>

    <p>

    </p>

</section>


<section class="section container">

    <div id="wishlistItems"></div>

</section>

</main>

<!-- FOOTER -->

        <div>
            <h3>TOY HAVEN</h3>
            <p>A simple online collection for toy fans and collectors.</p>
        </div>

        <div>
            <h3>Quick Links</h3>

            <a href="wishlist.html">Wishlist</a>

            <form id="newsletterForm" class="newsletter">

                <input
                    id="newsletterEmail"
                    type="email"
                    placeholder="Your email"
                    aria-label="Newsletter email address"
                    required
                >

                <button class="btn btn-white" type="submit">
                    Join
                </button>

            </form>

            <p id="newsletterMessage"></p>
        </div>

    </div>

    <div class="container footer-bottom">
        <p>© 2026 Toy Haven</p>
    </div>
